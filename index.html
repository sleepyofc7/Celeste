<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121214">

    <title>Abrindo Celeste...</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
            background-color: #121214;
            color: #ffffff;
            text-align: center;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background-color: #ff6b81;
        }

        p {
            color: #b8b8bd;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>Abrindo o Celeste Android...</h1>

    <p id="status">
        Toque no botão abaixo se o jogo não abrir automaticamente.
    </p>

    <a id="appLink" class="btn"
       href="intent:#Intent;package=org.celesteandroid.celeste;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end">
        Abrir Jogo Agora
    </a>

    <script>
        const pacote = "org.celesteandroid.celeste";

        let tentativaRealizada = false;

        function tentarAbrir() {
            if (tentativaRealizada) return;

            tentativaRealizada = true;

            document.getElementById("status").textContent =
                "Tentando abrir o jogo...";

            const intent =
                "intent:#Intent;" +
                "action=android.intent.action.MAIN;" +
                "category=android.intent.category.LAUNCHER;" +
                "package=" + pacote + ";" +
                "end";

            window.location.href = intent;
        }

        document.getElementById("appLink").addEventListener("click", function(e) {
            e.preventDefault();
            tentarAbrir();
        });

        // Tentativa automática ao carregar a página.
        // Alguns navegadores bloqueiam a abertura automática.
        window.addEventListener("load", function() {
            setTimeout(tentarAbrir, 300);
        });
    </script>

</body>
</html>
