<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrindo Celeste...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121214;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Abrindo o Celeste Android...</h1>
    <p>Se o jogo não abrir, use o botão abaixo para forçar o início:</p>
    
    <!-- Forçando um esquema direto de URI sem a rota padrão da Google Play -->
    <a id="appLink" href="org.celesteandroid.celeste://start" class="btn">Abrir Jogo Agora</a>

    <script>
        function tentarAbrir() {
            // Tenta abrir usando o esquema direto do pacote
            window.location.href = "org.celesteandroid.celeste://start";
            
            // Se falhar e o Chrome travar, tenta o formato de intent modificado sem pacote de fallback
            setTimeout(function() {
                window.location.href = "intent://start#Intent;scheme=org.celesteandroid.celeste;package=org.celesteandroid.celeste;S.browser_fallback_url=javascript:void(0);end";
            }, 500);
        }

        window.onload = function() {
            // Executa a tentativa automática ao carregar
            tentarAbrir();
            
            // Vincula a mesma função segura ao clique do botão
            document.getElementById('appLink').addEventListener('click', function(e) {
                e.preventDefault();
                tentarAbrir();
            });
        };
    </script>

</body>
</html>
