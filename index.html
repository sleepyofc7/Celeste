<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrindo Celeste...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121214;
            color: #ffffff;
            text-align: center;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #5865F2;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>

    <h1>Abrindo o Celeste Android...</h1>
    <p>Se o jogo não abrir sozinho, clique no botão abaixo:</p>
    
    <!-- Modificado: Adicionado S.browser_fallback_url=inline para evitar a Play Store -->
    <a id="appLink" href="intent://#Intent;package=org.celesteandroid.celeste;S.browser_fallback_url=inline;end" class="btn">Abrir Jogo</a>

    <script>
        window.onload = function() {
            // Sintaxe que diz ao Chrome: "Se falhar, fique na mesma página e não vá para a Play Store"
            var appIntentUrl = "intent://#Intent;package=org.celesteandroid.celeste;S.browser_fallback_url=inline;end";
            
            // Tenta abrir direto
            window.location.href = appIntentUrl;
            
            // Segunda tentativa automática caso a primeira seja bloqueada
            setTimeout(function() {
                var link = document.getElementById('appLink');
                if (link) {
                    link.click();
                }
            }, 300);
        };
    </script>

</body>
</html>
